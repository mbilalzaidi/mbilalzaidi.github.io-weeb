# Nginx Configuration for Ollama with SSL
# File: /etc/nginx/sites-available/learnwithus.cloud

server {
    listen 80;
    server_name learnwithus.cloud www.learnwithus.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name learnwithus.cloud www.learnwithus.cloud;

    # SSL Certificate paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/learnwithus.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnwithus.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root directory for static files
    root /var/www/html;
    index index.html index.htm;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Ollama API proxy
    location /api/ {
        proxy_pass http://localhost:11434/api/;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Bypass cache for API requests
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running AI requests
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Logs
    access_log /var/log/nginx/learnwithus.cloud_access.log;
    error_log /var/log/nginx/learnwithus.cloud_error.log;
}
